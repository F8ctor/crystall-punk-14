- type: entity
  parent: BaseItem
  id: CP14ModularBladeScimitarBase
  categories: [ ForkFiltered ]
  abstract: true
  description: A curved, single-edged sword known for its sharp edge and elegant design.
  components:
  - type: Item
    storedRotation: 45
    shape:
    - 0,0,0,1
    storedOffset: 0, 10

- type: entity
  parent: CP14ModularBladeScimitarBase
  id: CP14ModularBladeIronScimitar
  name: iron scimitar blade
  components:
  - type: Sprite
    sprite: _CP14/Objects/ModularTools/Blade/Scimitar/skimitar.rsi
    layers:
    - state: icon
  - type: CP14ModularCraftPart
    possibleParts:
    - BladeIronScimitar
  - type: CP14Material
    materials:
      CP14Iron: 15

- type: entity
  parent: CP14ModularBladeScimitarBase
